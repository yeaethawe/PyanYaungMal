{% if g.adding_account %}
    <p class="lede add-account-note">
        {% if g.user %}
            {{ t('add_account.note', email=g.user['email']) }}
        {% else %}
            {{ t('add_account.note_generic') }}
        {% endif %}
    </p>
    <form class="inline-form" action="{{ url_for('cancel_add_account') }}" method="post">
        <button type="submit" class="btn btn-ghost">{{ t('cancel') }}</button>
    </form>
{% endif %}
